<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Responsive Contact Section</title>
    <!-- <style>
        *{
            border: 1px solid red;
        }
    </style> -->
</head>
<body class="bg-slate-100">
    <div class="page-heading">
        <h2 class="page-title">Get In Touch</h2>
        <p class="page-subtitle">Have a project in mind or just want to say hello? I'd love to hear from you.</p>
    </div>

    <section class="contact-section">
        <!-- contact info -->
        <div class="contact-info">
            <div class="contact-info-items">
                <i class="fa-solid fa-envelope"></i>
                <p>Email : arpith.raj.622@gmail.com</p>
            </div>
            <div class="contact-info-items">
                <i class="fa-solid fa-phone"></i>
                <p>Phone : +91 8660271330</p>
            </div>
            <div class="contact-info-items">
                <i class="fa-solid fa-location-dot"></i>
                <p>Location : Raichur, Karnataka</p>
            </div>
        </div>

        <!-- contact form -->
        <div class="contact-form">
            <form action="#" class="flex flex-col">
                <label for="">Name:</label>
                <input type="text" placeholder="Arpith Raj">
                <label for="">Email:</label>
                <input type="text" placeholder="arpith.raj.622@gmail.com">
                <label for="">Subject:</label>
                <input type="text" placeholder="Subject">
                <label for="">Message:</label>
                <textarea name="" id="" placeholder="Write your message..."></textarea>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </section>
</body>
</html>
